    id: objetivo
    attributes: { label: "Objetivo", description: "¿Qué se consigue y por qué hace falta?" }
    validations: { required: true }
  - type: textarea
    id: tareas
    attributes:
      label: Tareas
      value: |
        - [ ] 
    validations: { required: true }
  - type: textarea
    id: hecho
    attributes:
      label: Hecho cuando
      value: |
        - [ ] 
    validations: { required: true }
  - type: input
    id: refs
    attributes: { label: "Referencias" }
