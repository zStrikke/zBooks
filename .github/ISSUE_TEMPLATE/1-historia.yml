name: 📗 Historia de usuario
description: Una funcionalidad contada desde el punto de vista de quien la usa.
labels: ["tipo: historia"]
body:
  - type: markdown
    attributes:
      value: "Recuerda: cada historia incluye su parte **web** y su parte **API v1** (ADR-0007)."
  - type: input
    id: como
    attributes: { label: Como…, placeholder: "miembro" }
    validations: { required: true }
  - type: input
    id: quiero
    attributes: { label: quiero…, placeholder: "liberar un libro indicando dónde lo dejo" }
    validations: { required: true }
  - type: input
    id: para
    attributes: { label: para…, placeholder: "que otra persona pueda encontrarlo" }
    validations: { required: true }
  - type: textarea
    id: criterios
    attributes:
      label: Criterios de aceptación
      description: Condiciones comprobables. Una por línea.
      value: |
        - [ ] 
    validations: { required: true }
  - type: textarea
    id: web
    attributes: { label: Web, description: "Pantallas o componentes Livewire afectados." }
  - type: textarea
    id: api
    attributes: { label: API v1, description: "Endpoints, códigos de estado, formato (JSON / GeoJSON)." }
  - type: textarea
    id: notas
    attributes: { label: Notas técnicas }
  - type: input
    id: refs
    attributes: { label: Referencias, placeholder: "RF-11 · ADR-0006 · Diagrama 03" }
